server:
  port: 8181

spring:
  application:
    name: Gateway-Service

  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: calculatrice-service
              uri: lb://CALCULATRICE-SERVICE
              predicates:
                - Path=/calculatrice-service/**
              filters:
                - StripPrefix=1

            - id: calculstatistique-service
              uri: lb://CALCULSTATISTIQUE-SERVICE
              predicates:
                - Path=/calculstatistique-service/**
              filters:
                - StripPrefix=1

          discovery:
            locator:
              enabled: true
              lower-case-service-id: true

eureka:
  client:
    registry-fetch-interval-seconds: ${EUREKA_REGISTRY_FETCH_INTERVAL_SECONDS:30}
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}